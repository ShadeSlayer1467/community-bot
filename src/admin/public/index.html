<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Community Bot</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/backdrop.js" defer></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <canvas id="ambientBackdrop" aria-hidden="true"></canvas>
    <div id="actionToast" hidden aria-hidden="true"></div>
    <main>
      <header>
        <div>
          <p class="eyebrow">COMMUNITY BOT / LOCAL ADMIN</p>
          <h1>Community Bot<span>.</span></h1>
          <p class="muted">One bot. Your community. Everything in its place.</p>
        </div>
        <div class="pill" id="badge">LOCAL HOST</div>
      </header>
      <p id="notice" role="status" aria-live="polite"></p>
      <section id="login">
        <h2>Welcome back</h2>
        <p>Use the admin password from your local configuration file.</p>
        <form id="loginForm">
          <label
            >Admin password<input
              id="password"
              type="password"
              autocomplete="current-password"
              required /></label
          ><button>Unlock panel</button>
        </form>
      </section>
      <div id="dashboard" hidden class="app-shell">
        <aside class="primary-nav"><nav id="navigation" aria-label="Primary navigation"></nav><button id="logout" class="quiet">Sign out</button></aside>
        <div class="page-content"><header class="page-header"><div><h2 id="pageTitle" tabindex="-1"></h2><p id="pageDescription" class="muted"></p></div></header><div id="pages"></div></div>
      </div>
      <footer>BOUND TO 127.0.0.1 · LOCAL ACCESS ONLY</footer>
    </main>
  </body>
</html>
